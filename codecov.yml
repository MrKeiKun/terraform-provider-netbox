---
ignore:
  - main.go
  - scripts/
  - "**/*_test.go"

coverage:
  status:
    # The total may not drop by more than 1% compared with the base of a pull request.
    project:
      default:
        target: auto
        threshold: 1%
    # New and changed lines have to be covered by tests.
    patch:
      default:
        target: 80%
