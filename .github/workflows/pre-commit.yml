---
name: Pre-commit

on:
  workflow_call:

permissions:
  contents: read

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install pre-commit
        run: python -m pip install pre-commit
      - name: Run pre-commit checks
        uses: pre-commit/action@v3.0.1
