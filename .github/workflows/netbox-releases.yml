---
name: NetBox releases

on:
  schedule:
    # every Monday, 03:00 in the Philippines
    - cron: "0 19 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  new-releases:
    name: Every NetBox release is tested
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Compare the NetBox releases with the CI matrix
        run: scripts/check_netbox_releases.sh
        env:
          GH_TOKEN: ${{ github.token }}
