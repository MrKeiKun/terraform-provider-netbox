---
name: Docs

on:
  workflow_call:

permissions:
  contents: read

jobs:
  generated-docs:
    name: Generated docs are up to date
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Regenerate docs and fail on changes
        run: |
          make docs
          git add --intent-to-add --all
          git diff --exit-code || (echo "::error title=Doc generation changes detected::Please update the docs and commit them to the PR" && exit 1)

  examples:
    name: Docs examples exist
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Ensure docs examples
        run: bash scripts/ensure_docs_examples.sh

  subcategories:
    name: Docs subcategories are allowed
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check allowed subcategories
        run: bash scripts/allowed_subcategories.sh
